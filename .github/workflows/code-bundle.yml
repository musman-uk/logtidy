name: Bundle Code

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set bundle filename
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "BUNDLE_FILE=${REPO_NAME,,}-code.txt" >> "$GITHUB_ENV"

      - name: Generate code bundle
        run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path

          out_name = os.environ["BUNDLE_FILE"]
          repo = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ.get("GITHUB_REF_NAME", "main")

          root_files = ["README.md", "Documentation.md", "RECORD.md", "Cargo.toml"]
          files = [Path(f) for f in root_files if Path(f).is_file()]

          for folder in ["src", "tests"]:
              base = Path(folder)
              if base.is_dir():
                  files.extend(sorted(p for p in base.rglob("*") if p.is_file()))

          with open(out_name, "w", encoding="utf-8") as out:
              out.write(f"# Code Bundle: {repo} ({ref})\n\n")
              for path in files:
                  out.write(f"{'=' * 60}\n")
                  out.write(f"FILE: {path.as_posix()}\n")
                  out.write(f"{'=' * 60}\n\n")
                  text = path.read_text(encoding="utf-8", errors="replace")
                  out.write(text.rstrip() + "\n\n")
          EOF

      - name: Attach bundle to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "$BUNDLE_FILE" --clobber

      - name: Upload bundle as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_FILE }}
          path: ${{ env.BUNDLE_FILE }}
