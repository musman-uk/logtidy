[package]
name = "logtidy"
version = "0.1.1"
edition = "2021"
authors = ["Mohammed Usman"]
description = "A CLI tool that normalises logs."
repository = "https://github.com/musman-uk/logtidy"
license = "GPL-3.0-only"
default-run = "logtidy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"

[[bin]]
name = "logtidy"
path = "src/main.rs"

[[bin]]
name = "lt"
path = "src/main.rs"