[package]
name = "logtidy"
version = "0.1.0"
edition = "2021"
authors = ["Mohammed Usman"]
description = "A CLI tool that normalises logs."
repository = "https://github.com/musman-uk/logtidy"

license = "LicenseRef-Logtidy"
license-file = "LICENSE"

[lib]
name = "logtidy"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
